# worldTraveler nginx 閘道 (單一來源)：瀏覽器 → http://127.0.0.1:<WT_PORT>
# 此資料夾掛載為容器的 /etc/nginx/conf.d；修改後：docker compose exec nginx nginx -s reload

# Docker 內建 DNS：upstream 以變數指定，每次請求重新解析
#   → API 容器未啟動時 nginx 仍可啟動 (回 502)；F5 重建 debug 容器 (IP 改變) 後不需重啟 nginx
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $wt_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 40m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;

    # 後端 API：每個 webapi 一個檔案 (wt new <語言> webapi 產生，可自行修改路徑前綴)
    include /etc/nginx/conf.d/routes/*.conf;

    # 存檔後自動重新載入的通知 (WebSocket)
    location /wsBundleDebugLog {
        set $wt_web web;
        proxy_pass http://$wt_web:80;
        include /etc/nginx/conf.d/proxy.params;
        proxy_read_timeout 1h;
    }

    # 前端網頁 (dir/)
    location / {
        set $wt_web web;
        proxy_pass http://$wt_web:80;
        include /etc/nginx/conf.d/proxy.params;
    }
}
